[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "faster_whisper.*",
    "keyring",
    "keyring.*",
    "PIL",
    "PIL.*",
    "WebKit",
    "webview",
]
ignore_missing_imports = true
