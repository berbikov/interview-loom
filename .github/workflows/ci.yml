name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check app desktop scripts tests
      - name: Type-check
        run: mypy app desktop scripts
      - name: Compile Python modules
        run: python -m compileall -q app desktop scripts tests migrations
      - name: Build static landing
        run: python scripts/build_landing.py
      - name: Verify landing output
        run: python scripts/verify_landing.py public
      - name: Check dependency consistency
        run: python -m pip check
